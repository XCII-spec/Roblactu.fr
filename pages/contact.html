<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us</title>

<link rel="stylesheet" href="style.css">

<!-- Icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>
<body>

<div class="contact-container">

    <!-- LEFT -->
    <div class="contact-info">
        <h1>Contact Us</h1>

        <p>
            Une question, une idée ou un projet ?
            Contactez-nous directement via le formulaire ✨
        </p>

        <div class="info-box">
            <i class="fa-solid fa-envelope"></i>
            <div>
                <h3>Email</h3>
                <span>contact@example.com</span>
            </div>
        </div>

        <div class="info-box">
            <i class="fa-solid fa-phone"></i>
            <div>
                <h3>Téléphone</h3>
                <span>+33 6 00 00 00 00</span>
            </div>
        </div>

        <div class="info-box">
            <i class="fa-solid fa-location-dot"></i>
            <div>
                <h3>Adresse</h3>
                <span>Paris, France</span>
            </div>
        </div>
    </div>

    <!-- RIGHT -->
    <div class="contact-form">

        <h2>Envoyer un message</h2>

        <form>

            <div class="input-box">
                <input type="text" placeholder="Votre nom" required>
            </div>

            <div class="input-box">
                <input type="email" placeholder="Votre email" required>
            </div>

            <div class="input-box">
                <input type="text" placeholder="Sujet">
            </div>

            <div class="input-box">
                <textarea placeholder="Votre message..." required></textarea>
            </div>

            <button type="submit">
                Envoyer le message
            </button>

        </form>

    </div>

</div>

  <style>/* ===== Google Font ===== */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
    overflow:hidden;
    position:relative;
}

/* Glow Background */
body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:#3b82f6;
    border-radius:50%;
    filter:blur(150px);
    opacity:0.3;
    top:-150px;
    left:-150px;
}

body::after{
    content:'';
    position:absolute;
    width:400px;
    height:400px;
    background:#8b5cf6;
    border-radius:50%;
    filter:blur(150px);
    opacity:0.3;
    bottom:-120px;
    right:-120px;
}

/* ===== Contact Card ===== */
.contact-container{
    position:relative;
    width:90%;
    max-width:1000px;
    display:grid;
    grid-template-columns:1fr 1fr;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
    z-index:10;
}

/* ===== Left Side ===== */
.contact-info{
    padding:60px;
    color:white;
    background:rgba(255,255,255,0.03);
}

.contact-info h1{
    font-size:3rem;
    margin-bottom:20px;
    font-weight:700;
}

.contact-info p{
    color:#cbd5e1;
    line-height:1.7;
    margin-bottom:35px;
}

.info-box{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.info-box i{
    width:50px;
    height:50px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:15px;
    background:rgba(255,255,255,0.1);
    color:#60a5fa;
    font-size:1.3rem;
}

/* ===== Form ===== */
.contact-form{
    padding:60px;
    background:rgba(15,23,42,0.7);
}

.contact-form h2{
    color:white;
    margin-bottom:30px;
    font-size:2rem;
}

.input-box{
    margin-bottom:20px;
}

.input-box input,
.input-box textarea{
    width:100%;
    padding:18px;
    border:none;
    outline:none;
    border-radius:18px;
    background:rgba(255,255,255,0.08);
    color:white;
    font-size:1rem;
    transition:0.3s;
    border:1px solid transparent;
}

.input-box input:focus,
.input-box textarea:focus{
    border:1px solid #3b82f6;
    background:rgba(255,255,255,0.12);
    box-shadow:0 0 20px rgba(59,130,246,0.4);
}

.input-box textarea{
    resize:none;
    min-height:140px;
}

.input-box input::placeholder,
.input-box textarea::placeholder{
    color:#94a3b8;
}

/* ===== Button ===== */
.contact-form button{
    width:100%;
    padding:18px;
    border:none;
    border-radius:18px;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    color:white;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.contact-form button:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 25px rgba(59,130,246,0.4);
}

/* ===== Responsive ===== */
@media(max-width:900px){

    .contact-container{
        grid-template-columns:1fr;
    }

    .contact-info,
    .contact-form{
        padding:40px;
    }

    .contact-info h1{
        font-size:2.2rem;
    }
} </style>

</body>
</html>
